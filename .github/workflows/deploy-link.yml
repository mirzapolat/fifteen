name: Deploy Link relay to VPS

# Only the relay is deployed; changes to the app itself don't trigger this.
on:
  push:
    branches: ["main"]
    paths:
      - "server/link/**"
      - ".github/workflows/deploy-link.yml"
  workflow_dispatch:

env:
  APP_NAME: "fifteen-link"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Files to VPS (Rsync)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ~/docker/apps/${{ env.APP_NAME }}"
          rsync -avz --delete-after \
            --filter=":e- .gitignore" \
            --filter="- node_modules/" \
            --filter="- .env" \
            --filter="- .env.*" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./server/link/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/docker/apps/${{ env.APP_NAME }}/

      - name: Build & Restart Containers
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            cd ~/docker/apps/${{ env.APP_NAME }} && \
            test -f .env || { echo 'Missing ~/docker/apps/${{ env.APP_NAME }}/.env (LINK_SECRET)'; exit 1; } && \
            DOCKER_BUILDKIT=1 docker compose up -d --build --remove-orphans && \
            docker image prune -f "

      - name: Check health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://fifteen.mirzapolat.com/health; then exit 0; fi
            sleep 3
          done
          echo "Relay did not answer on /health" && exit 1
