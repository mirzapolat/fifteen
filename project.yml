# Generate the Xcode project with:  xcodegen generate
name: Fifteen
options:
  bundleIdPrefix: com.mirzapolat
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "56746T8S3D"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  # Updates for the direct Mac download (docs/SPARKLE_PLAN.md). Mac target only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Fifteen:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
      - Resources
    dependencies:
      - package: Sparkle
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Fifteen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Free, no account, no ads.
        # Lets Link talk to a relay on this Mac or the local network while developing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle: the feed is the appcast attached to the newest GitHub release.
        SUFeedURL: https://github.com/mirzapolat/fifteen/releases/latest/download/appcast.xml
        SUPublicEDKey: "D8vjG57p09kEOgZWkci15kU5ICuAEnxhiI2TMZWXNCA="
        SUEnableAutomaticChecks: true
        SUEnableSystemProfiling: false
    entitlements:
      path: macOS/Fifteen.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: Fifteen
        PRODUCT_BUNDLE_IDENTIFIER: com.mirzapolat.fifteen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Day to day: ad-hoc signed, runs on this Mac without any account.
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
        # Releases: signed by the team, then exported with Developer ID and notarized
        # (scripts/release-mac.sh).
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
    scheme: {}

  Fifteen-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - Resources
    dependencies:
      - target: FifteenWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Fifteen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        # Lets Link talk to a relay on this Mac or the local network while developing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Fifteen
        PRODUCT_BUNDLE_IDENTIFIER: com.mirzapolat.fifteen
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  FifteenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/LiveActivity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fifteen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirzapolat.fifteen.widgets
        # The Live Activity's buttons are compiled here too, but only the app runs them.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  FifteenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Model/Records.swift
      - Shared/Analytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirzapolat.fifteen.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  FifteenTests:
    build:
      targets:
        FifteenTests: [test]
    test:
      targets:
        - FifteenTests
